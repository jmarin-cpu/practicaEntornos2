<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería Página 404</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecera">
        <h1 class="logo">Librería Página 404</h1>
        <nav>
            <ul class="menu">
                <li><a href="#seccion">Novedades</a></li>
                <li><a href="#info">Horario</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="portada">
            <h2>Libros para mentes curiosas</h2>
            <p>Novelas, cómics y manuales técnicos. Pide tu libro y te lo guardamos 48 horas.</p>
            <a href="#seccion" class="boton">Ver novedades</a>
        </section>

        <!-- Sección principal de la página
        <section id="seccion" class="listado">
            <h2>Novedades</h2>
            <div class="productos">
                <article class="tarjeta">
                    <h3>El último commit</h3>
                    <p>Thriller tecnológico en Silicon Valley.</p>
                    <span class="precio">18,90 €</span>
                </article>
                <article class="tarjeta">
                    <h3>CSS para humanos</h3>
                    <p>Aprende maquetación sin dolor.</p>
                    <span class="precio">24,50 €</span>
                </article>
                <article class="tarjeta">
                    <h3>Cómic: Bug Hunters</h3>
                    <p>Aventuras de un equipo de QA.</p>
                    <span class="precio">12,00 €</span>
                </article>
            </div>
        </section>

        <section id="info" class="info">
            <h2>Horario</h2>
            <p>Lunes a sábado: 10:00 – 21:00</p>
            <p>Domingos: cerrado</p>
        </section>
    </main>

    <footer id="contacto" class="pie">
        <p>Calle Biblioteca, 7 · hola@pagina404.es</p>
    </footer>
</body>
</html>
